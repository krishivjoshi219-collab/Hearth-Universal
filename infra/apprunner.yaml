version: 1.0
runtime: python312
build:
  commands:
    build:
      - pip install --upgrade pip
      - pip install -e ".[dev,aws]"
run:
  command: python mcp-server/server.py
  network:
    port: 8787
  env:
    - name: PORT
      value: "8787"
    - name: HEARTH_BRAIN_PROVIDER
      value: "local"
    - name: AWS_BEDROCK_ENABLED
      value: "1"
    - name: AWS_REGION
      value: "us-east-1"
    - name: AWS_BEDROCK_MODEL
      value: "auto"
    - name: AWS_BEDROCK_MAX_ATTEMPTS
      value: "5"
