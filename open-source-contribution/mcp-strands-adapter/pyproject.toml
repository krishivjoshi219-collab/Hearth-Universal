[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-strands-adapter"
version = "0.2.0"
authors = [
  { name="Hearth Universal Contributors" },
]
description = "Expose AWS Strands Agents SDK tools and agents as Model Context Protocol (MCP 2025-11-25) tools over Streamable HTTP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["mcp", "model-context-protocol", "aws-strands", "bedrock", "alexa-plus", "agentic-ai"]
dependencies = ["mcp>=1.23.0,<2.2"]

[project.optional-dependencies]
# Install the Strands integration:  pip install "mcp-strands-adapter[strands]"
strands = ["strands-agents>=1.57.0,<2"]
aws = ["strands-agents>=1.57.0,<2", "boto3>=1.34.0,<2"]
dev = ["pytest>=8.0.0", "strands-agents>=1.57.0,<2"]

[tool.setuptools.packages.find]
include = ["mcp_strands_adapter*"]

[project.urls]
"Homepage" = "https://github.com/krishivjoshi219-collab/Hearth-Universal"
"Bug Tracker" = "https://github.com/krishivjoshi219-collab/Hearth-Universal/issues"