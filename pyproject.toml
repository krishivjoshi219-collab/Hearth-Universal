[project]
name = "hearth-universal"
version = "0.1.0"
description = "Hearth Universal — open-source glass-box personal agent on Alexa+ MCP (2025-11-25 Streamable HTTP). Any brain, any home, propose-never-execute."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "mcp>=1.29.1,<2",
  "fastapi>=0.115,<0.122",
  "uvicorn>=0.30,<0.35",
  "pydantic>=2.7,<3",
  "pyyaml>=6.0,<7",
  "httpx>=0.27,<0.29",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1", "pytest-cov>=5", "ruff>=0.4", "mypy>=1.10", "bandit>=1.7", "pip-audit>=2.7"]
aws = ["boto3>=1.34.0,<2", "strands-agents>=1.57.0,<2"]
all = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1", "pytest-cov>=5", "boto3>=1.34.0,<2", "strands-agents>=1.57.0,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
  "ignore::DeprecationWarning:starlette.testclient",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# E4/E7/E9/F: correctness. I/UP: modernization. B/SIM/ASYNC/DTZ/PERF/PIE/RUF:
# genuine bugs. S (bandit) and BLE (blind-except) are intentionally excluded:
# - S duplicates `bandit -r src` already enforced in CI.
# - BLE001 flags the project's deliberate error-to-result contract
#   (`except Exception -> {"ok": False, ...}`) used for offline-first safety.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "ASYNC", "DTZ", "PERF", "PIE", "PLW", "RUF", "ISC", "FURB"]
ignore = ["E501", "S", "BLE"]

[tool.ruff.lint.per-file-ignores]
# Module-level singletons and monotonic counters are a deliberate, documented
# pattern (one process, one household); `global` is the honest way to mutate
# them. home_mock's late import avoids a circular import at module load.
"src/hearth/alexa.py" = ["PLW0603"]
"src/hearth/commerce.py" = ["PLW0603"]
"src/hearth/heartbeat.py" = ["PLW0603"]
"src/hearth/home_mock.py" = ["PLW0603", "E402"]
"src/hearth/strands_agent.py" = ["PLW0603"]

# Household narration uses typographic × and − (the day-replay rail renders
# them as prose); everything else in replay.py is lint-clean.
"src/hearth/replay.py" = ["RUF001"]

# The server bootstraps env/config before importing the library, mutates one
# process-level persona singleton, and reads small local JSON state files
# synchronously inside async routes. All deliberate for a single-node
# household deployment; documented in docs/production_readiness.md.
"mcp-server/server.py" = ["E402", "PLW0603", "PERF401", "SIM115", "ASYNC230", "ASYNC240"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
