[project]
name = "hearth-universal"
version = "0.1.0"
description = "Hearth Universal — open-source glass-box personal agent on Alexa+ MCP (2025-11-25 Streamable HTTP). Any brain, any home, propose-never-execute."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "mcp>=1.29.1,<2",
  "fastapi>=0.115,<0.122",
  "uvicorn>=0.30,<0.35",
  "pydantic>=2.7,<3",
  "pyyaml>=6.0,<7",
  "httpx>=0.27,<0.29",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1", "pytest-cov>=5", "ruff>=0.4", "mypy>=1.10", "bandit>=1.7", "pip-audit>=2.7"]
aws = ["boto3>=1.34.0,<2"]
all = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1", "pytest-cov>=5", "boto3>=1.34.0,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
